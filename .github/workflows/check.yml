name: Check Stafford planning list

on:
  schedule:
    - cron: "0 7 * * *"  # daily 07:00 UTC — cheap to run; only acts when a new weekly list is published
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run checker
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          GOOGLE_FORM_CSV_URL: ${{ secrets.GOOGLE_FORM_CSV_URL }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python scripts/fetch_and_report.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/applications.json data/state.json docs/index.html
          git diff --cached --quiet || git commit -m "Update Stafford planning data"
          git push
